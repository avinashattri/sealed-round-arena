[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sealed-round-arena"
version = "0.1.0"
description = "Sealed Round Arena Infrastructure"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["contracts", "referee", "loop", "tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
